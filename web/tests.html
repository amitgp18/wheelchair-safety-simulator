<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px auto; max-width: 760px; padding: 0 16px; background: #0a1020; color: #e8eefa; }
  h1 { font-size: 22px; }
  li { margin: 2px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .pass::marker { color: #5ad19a; content: "PASS  "; }
  .fail::marker { color: #ff6b6b; content: "FAIL  "; }
  .summary { font-weight: 600; }
</style>
</head>
<body>
<h1>Logic tests</h1>
<p class="summary" id="summary">Running...</p>
<ul id="list"></ul>
<script src="js/config.js"></script>
<script src="js/structures.js"></script>
<script src="js/safety.js"></script>
<script src="js/simulation.js"></script>
<script src="js/scenarios.js"></script>
<script src="tests/tests.js"></script>
<script>
  var results = WC.runTests();
  var failed = results.filter(function (r) { return !r.pass; }).length;
  document.getElementById('summary').textContent = (results.length - failed) + ' passed, ' + failed + ' failed';
  results.forEach(function (r) {
    var li = document.createElement('li');
    li.className = r.pass ? 'pass' : 'fail';
    li.textContent = r.name;
    document.getElementById('list').appendChild(li);
  });
</script>
</body>
</html>
